window.adminShowStatusPicker = function(btn) {
  var orderId = btn.getAttribute('data-oid');
  // Remove any existing picker
  var existing = document.getElementById('status-picker-' + orderId);
  if (existing) { existing.remove(); return; }

  var statuses = [
    { key: 'pending_approval', label: 'Pending',    color: '#f59e0b', bg: '#fffbeb' },
    { key: 'in_flight',        label: 'In Flight',  color: '#1a6ef0', bg: '#eff6ff' },
    { key: 'delivered',        label: 'Delivered',  color: '#16a34a', bg: '#f0fdf4' },
    { key: 'returned',         label: 'Returned',   color: '#16a34a', bg: '#f0fdf4' },
    { key: 'cancelled',        label: 'Cancelled',  color: '#ef4444', bg: '#fef2f2' },
    { key: 'delayed',          label: 'Delayed',    color: '#d97706', bg: '#fffbeb' },
    { key: 'failed',           label: 'Failed',     color: '#ef4444', bg: '#fef2f2' },
    { key: 'refunded',         label: 'Refunded',   color: '#7c3aed', bg: '#f5f3ff' },
  ];

  var grid = '<div id="status-picker-' + orderId + '" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;padding:10px;background:#fff;border:1px solid #e8e8e8;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.1)">'
    + '<div style="grid-column:1/-1;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#9ca3af;margin-bottom:2px">Set order status</div>';

  statuses.forEach(function(s) {
    grid += '<button onclick="adminOrderAction(this)" data-oid="' + orderId + '" data-ns="' + s.key + '" '
      + 'style="padding:8px 10px;border-radius:8px;border:1px solid ' + s.color + '22;background:' + s.bg + ';color:' + s.color + ';font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font);text-align:left;transition:.12s" '
      + '>'  
      + s.label + '</button>';
  });

  grid += '</div>';

  // Insert after the button's parent actions div
  var actionsDiv = btn.closest('.order-actions');
  if (actionsDiv) actionsDiv.insertAdjacentHTML('afterend', grid);
};

window.adminOrderAction = function(btn) {
  var orderId = btn.getAttribute("data-oid");
  var newStatus = btn.getAttribute("data-ns");
  // Close picker if open
  var picker = document.getElementById('status-picker-' + orderId);
  if (picker) picker.remove();
  var labels = { delivered: "Mark as Delivered", cancelled: "Cancel Order", in_flight: "Mark In Flight", returned: "Mark as Returned", delayed: "Mark as Delayed", failed: "Mark as Failed", refunded: "Mark as Refunded", pending_approval: "Reset to Pending" };
  var colors = { delivered: "green", cancelled: "red", in_flight: "amber", returned: "green", delayed: "amber", failed: "red", refunded: "blue", pending_approval: "amber" };
  var msgs = {
    delivered:        "Mark this order as delivered.",
    cancelled:        "Cancel this order? The tools will be marked available again.",
    in_flight:        "Mark this order as in-flight?",
    returned:         "Mark items as returned? This will add them back to stock.",
    delayed:          "Mark this order as delayed?",
    failed:           "Mark this order as failed?",
    refunded:         "Mark this order as refunded?",
    pending_approval: "Reset this order back to pending approval?"
  };
  showConfirm({
    title:   labels[newStatus] || "Update Order",
    msg:     msgs[newStatus]   || "Update this order status?",
    okLabel: labels[newStatus] || "Confirm",
    color:   colors[newStatus] || "blue",
    onOk: async function() {
      var fb = window._fb;
      try {
        // Get order first so we have userId + items
        var orderSnap = await fb.getDoc(fb.doc(fb.db, "allOrders", orderId));
        var orderData = orderSnap.data();
        if (!orderData) { showToast("Order not found"); return; }

        var update = { status: newStatus, updatedAt: fb.serverTimestamp() };
        if (newStatus === "delivered") update.deliveredAt = fb.serverTimestamp();

        // Update allOrders (admin view)
        await fb.updateDoc(fb.doc(fb.db, "allOrders", orderId), update);

        // Update user's own order subcollection so their app updates in real-time
        if (orderData.userId && orderData.userOrderId) {
          try {
            await fb.updateDoc(
              fb.doc(fb.db, "users", orderData.userId, "orders", orderData.userOrderId),
              update
            );
          } catch(e) { console.error("Could not update user order:", e.message); showToast("Warning: " + e.message); }
        }

        // Restore stock in RTDB when returned or cancelled
        if (newStatus === "returned" || newStatus === "cancelled") {
          var items = orderData.items || [];
          for (var i = 0; i < items.length; i++) {
            if (items[i].id) await markToolAvailable(fb, items[i].id);
          }
        }
        showToast("Order updated");
        adminLoadOrders();
      } catch(e) {
        showToast("Failed: " + e.message);
      }
    }
  });
};

window.adminDeleteOrder = function(btn) {
  var orderId = btn.getAttribute("data-oid");
  showConfirm({

    msg:     "This will permanently delete the order record. This cannot be undone.",

        await fb.deleteDoc(fb.doc(fb.db, "allOrders", orderId));
        showToast("Order deleted");
        adminLoadOrders();

      }
    }

};



window.renderPartnerApiPage = async function() {
  // Make sure page-api is the active page (not page-admin)
  document.querySelectorAll(".page").forEach(function(p){ p.classList.remove("active"); });
  var wrap = el("page-api");
  if (!wrap) return;
  wrap.classList.add("active");
  // Highlight nav
  document.querySelectorAll(".nav-link").forEach(function(l){ l.classList.remove("active"); });
  var nl = document.getElementById("nav-api"); if (nl) nl.classList.add("active");

  if (!currentUser) {
    wrap.innerHTML = '<div style="max-width:420px;margin:80px auto;text-align:center;padding:0 24px"><h2 style="font-size:22px;font-weight:800;margin-bottom:8px">Partner API</h2><p style="font-size:14px;color:var(--muted);margin-bottom:24px">Sign in with your partner account to manage API keys.</p><button class="btn-primary" onclick="showAuth()">Sign In</button></div>';
    return;
  }

  wrap.innerHTML = '<div style="max-width:900px;margin:0 auto;padding:32px 24px"><div style="color:var(--muted);font-size:14px">Loading...</div></div>';

  var fb = window._fb; if (!fb) return;

  try {
    // Only real partners can use this dashboard — admins use the admin panel
    var isAdm = typeof checkAdmin === "function" && checkAdmin();
    var isPartner = window._isPartnerUser || false;

    if (isAdm) {
      wrap.innerHTML = [
        '<div style="max-width:480px;margin:80px auto;text-align:center;padding:0 24px">',
          '<div style="font-size:40px;margin-bottom:16px">&#x1F512;</div>',
          '<h2 style="font-size:20px;font-weight:800;margin-bottom:8px">Admin accounts use the Admin panel</h2>',
          '<p style="font-size:14px;color:var(--muted);margin-bottom:24px">Partner management is in the Admin panel.</p>',
          '<button class="btn-primary" onclick="showPage(\'admin\')">Go to Admin Panel</button>',
        '</div>'
      ].join('');
      return;
    }

    if (!isPartner) {
      wrap.innerHTML = partnerApplyHTML();
      return;
    }

    // Load partner doc (for name/stationId)
    var partnerDoc = {name: currentUser.displayName || currentUser.email, email: currentUser.email};
    try {
      var pSnap = await fb.getDocs(fb.query(fb.collection(fb.db,"partners"),fb.where("email","==",currentUser.email)));
      if (!pSnap.empty) partnerDoc = Object.assign({_id:pSnap.docs[0].id}, pSnap.docs[0].data());
    } catch(e) { console.warn("partners read:", e.message); }

    // Load API keys — each partner can read their own keys
    var apiKeys = [];
    try {
      var keysSnap = await fb.getDocs(fb.query(fb.collection(fb.db,"apiKeys"),fb.where("partnerEmail","==",currentUser.email)));
      apiKeys = keysSnap.docs.map(function(d){ return Object.assign({_docId:d.id},d.data()); });
    } catch(e) { console.warn("apiKeys read:", e.message); }

    // Load deliveries for this partner
    var deliveries = [];
    try {
      var delivSnap = await fb.getDocs(fb.query(fb.collection(fb.db,"deliveries"),fb.where("partnerEmail","==",currentUser.email),fb.orderBy("createdAt","desc"),fb.limit(50)));
      deliveries = delivSnap.docs.map(function(d){return Object.assign({_id:d.id},d.data());});
    } catch(e) { console.warn("deliveries read:", e.message); }

    var totalD = deliveries.length;
    var pendingD = deliveries.filter(function(d){return d.status==="pending_approval";}).length;
    var approvedD = deliveries.filter(function(d){return ["approved","dispatching","dispatched","delivered"].includes(d.status);}).length;

    wrap.innerHTML =
      '<div style="max-width:900px;margin:0 auto;padding:32px 24px">' +

      // Header
      '<div style="margin-bottom:28px"><div style="font-size:26px;font-weight:800;letter-spacing:-.02em">' + (partnerDoc.name||currentUser.email) + '</div>' +
      '<div style="font-size:14px;color:var(--muted);margin-top:3px">Partner API Dashboard · ' + currentUser.email + '</div></div>' +

      // Stats
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:28px">' +
        '<div class="admin-stat"><div class="admin-stat-val">' + apiKeys.filter(function(k){return k.active;}).length + '</div><div class="admin-stat-label">Active Keys</div></div>' +
        '<div class="admin-stat"><div class="admin-stat-val">' + totalD + '</div><div class="admin-stat-label">Total Orders</div></div>' +
        '<div class="admin-stat"><div class="admin-stat-val amber">' + pendingD + '</div><div class="admin-stat-label">Awaiting Approval</div></div>' +
        '<div class="admin-stat"><div class="admin-stat-val green">' + approvedD + '</div><div class="admin-stat-label">Dispatched</div></div>' +
      '</div>' +

      // Tabs
      '<div class="admin-tabs" style="margin-bottom:24px">' +
        '<button class="admin-tab active" data-pp="pkeys" onclick="partnerApiTab(this)">API Key</button>' +
        '<button class="admin-tab" data-pp="pusage" onclick="partnerApiTab(this)">Orders <span id="pp-pending-badge" style="display:none;background:#ef4444;color:#fff;font-size:9px;font-weight:800;padding:1px 6px;border-radius:10px;margin-left:3px"></span></button>' +
        '<button class="admin-tab" data-pp="pdocs" onclick="partnerApiTab(this)">Docs</button>' +
      '</div>' +

      // Keys panel
      '<div class="admin-panel active" id="pp-pkeys">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">' +
          '<div style="font-size:15px;font-weight:700">Your API Keys</div>' +
          '<button onclick="partnerGenerateKey()" class="admin-add-btn">+ Generate New Key</button>' +
        '</div>' +
        '<div id="papi-keys-list">' + renderApiKeysList(apiKeys) + '</div>' +
      '</div>' +

      // Usage panel
      '<div class="admin-panel" id="pp-pusage">' +
        renderPartnerOrders(deliveries) +
      '</div>' +

      '<div class="admin-panel" id="pp-pdocs">' + renderApiDocs() + '</div>' +

      '</div>';

    } catch(e) {
    console.error("renderPartnerApiPage:", e);
    wrap.innerHTML = [
      '<div style="max-width:900px;margin:0 auto;padding:32px 24px">',
        '<div style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:14px;padding:24px;text-align:center">',
          '<div style="font-size:16px;font-weight:700;color:#ef4444;margin-bottom:6px">Something went wrong</div>',
          '<div style="font-size:13px;color:var(--muted);margin-bottom:16px">' + e.message + '</div>',
          '<button onclick="renderPartnerApiPage()" style="padding:9px 20px;background:var(--blue);color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font)">Try Again</button>',
        '</div>',
      '</div>'
    ].join('');
  }
};

      inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') partnerGenerateKeyConfirm(); });
    }
  }, 50);
};

window.partnerCloseGenModal = function() { var m = document.getElementById('pkey-gen-modal'); if(m) m.remove(); };

window.partnerGenerateKeyConfirm = async function() {
  var input = document.getElementById("pkey-gen-input");
  var label = input ? input.value.trim() : "Production";
  if (!label) label = "Production";

  var btn = document.getElementById("pkey-gen-confirm-btn");
  if (btn) { btn.disabled = true; btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" style="animation:spin .6s linear infinite"><path d="M21 12a9 9 0 11-9-9"/></svg> Generating...'; }

  var fb = window._fb; if (!fb || !currentUser) return;
  try {
    await _generateNewKey(label);
    var modal = document.getElementById("pkey-gen-modal");
    if (modal) modal.remove();
    showToast("✓ API key generated!");
  } catch(e) {
    showToast("Error: " + e.message);
    if (btn) { btn.disabled = false; btn.innerHTML = "Generate Key"; }
  }
};

window.partnerRegenerateKey = async function(oldDocId) {
  showConfirm({
    title: "Regenerate API Key?",
    msg: "Your current key will stop working immediately. Any live integrations using it will break until you update them.",
    okLabel: "Regenerate",
    color: "amber",
    onOk: async function() {
      var fb = window._fb; if (!fb) return;
      try {
        // Delete old key
        await fb.deleteDoc(fb.doc(fb.db, "apiKeys", oldDocId));
        // Generate new
        await _generateNewKey();
        showToast("✓ New key generated — update your website");
      } catch(e) { showToast("Error: " + e.message); }
    }
  });
};

async function _generateNewKey(label) {
  var fb = window._fb;
  var arr = new Uint8Array(32); crypto.getRandomValues(arr);
  var key = "drv_" + Array.from(arr).map(function(b){ return b.toString(16).padStart(2,"0"); }).join("").slice(0,40);
  var pSnap = await fb.getDocs(fb.query(fb.collection(fb.db,"partners"),fb.where("email","==",currentUser.email)));
  var pd = pSnap.empty ? {} : pSnap.docs[0].data();
  await fb.setDoc(fb.doc(fb.db, "apiKeys", key), {
    key: key,
    label: label || "Production",
    partnerEmail: currentUser.email,
    partnerName: pd.name || currentUser.email,
    stationId: pd.stationId || ("station-" + currentUser.email.split("@")[0]),
    active: true,
    createdAt: fb.serverTimestamp()
  });
  renderPartnerApiPage();
}

window.partnerRevealKey = function(docId) {
  var display = document.getElementById("pkey-" + docId);
  var btn     = document.getElementById("pkey-" + docId + "-btn");
  if (!display) return;
  var key    = display.dataset.key || "";
  var masked = "drv_" + Array(37).join("•");
  if (display.dataset.revealed === "1") {
    display.textContent = masked;
    display.style.color = "var(--muted)";
    display.dataset.revealed = "0";
    if (btn) btn.textContent = "Show";
  } else {
    display.textContent = key;
    display.style.color = "var(--blue)";
    display.dataset.revealed = "1";
    if (btn) btn.textContent = "Hide";
    setTimeout(function() {
      if (display && display.dataset.revealed === "1") {
        display.textContent = masked;
        display.style.color = "var(--muted)";
        display.dataset.revealed = "0";
        if (btn) btn.textContent = "Show";
      }
    }, 30000);
  }
};

window.partnerCopyKey = function(docId) {
  var display = document.getElementById("pkey-" + docId);
  if (!display) return;
  var key = display.dataset.key || "";
  if (navigator.clipboard) navigator.clipboard.writeText(key).catch(function(){});
  showToast("✓ API key copied!");
};

function renderApiDocs() {
  var pre = function(code) {
    return '<pre style="background:var(--bg3);border-radius:8px;padding:12px;font-size:12px;overflow-x:auto;margin:0;color:var(--text2);font-family:monospace">' + code + '</pre>';
  };
  var tag = function(method, color) {
    return '<span style="font-size:11px;font-weight:800;padding:3px 9px;border-radius:5px;background:' + color + ';font-family:monospace">' + method + '</span>';
  };

    var nl = "\n";
  var reqBody = ['{', nl,
    '  "customerName": "John Smith",', nl,
    '  "customerPhone": "555-123-4567",', nl,
    '  "deliveryAddress": "123 Main St, Plano TX",', nl,
    '  "items": [{ "name": "DeWalt Drill", "qty": 1 }],', nl,
    '  "notes": "Leave at door"', nl, '}'

  var postResp = ['{', nl,
    '  "deliveryId": "abc123xyz",', nl,
    '  "status": "pending_approval",', nl,
    '  "message": "Awaiting partner confirmation."', nl, '}'

    '  "deliveryId": "abc123xyz",', nl,

  ].join('');
  var listResp = ['{', nl,
    '  "deliveries": [{ "deliveryId": "...", "status": "delivered" }]', nl, '}'

    var endpoint = function(method, path, desc, body, resp) {

    '</div>';
  }).join("") + '</div>';
}

function startApp() {
  var fb = window._fb;

  // Firestore paths
  function pRef(uid){ return fb.doc(fb.db,"users",uid,"data","profile"); }
  function cRef(uid){ return fb.doc(fb.db,"users",uid,"data","cart"); }
  function oCol(uid){ return fb.collection(fb.db,"users",uid,"orders"); }

  // Real saveCart
  saveCart = function() {
    if (!currentUser) return;
    clearTimeout(cartTimer);
    cartTimer = setTimeout(function(){
      fb.setDoc(cRef(currentUser.uid), {
        items: cart.map(function(i){
          return {id:i.id,name:i.name,cat:i.cat,pph:i.pph,retail:i.retail,
                  rating:i.rating,desc:i.desc,eta:i.eta,hours:i.hours};
        }),
        updatedAt: fb.serverTimestamp()
      }).catch(function(e){ console.error("saveCart",e); });
    }, 700);
  };

  async function loadProfile() {
    try {
      var snap = await fb.getDoc(pRef(currentUser.uid));
      if (snap.exists()) {
        userProfile = snap.data();
      } else {
        var parts = (currentUser.displayName||"").split(" ");
        userProfile = {
          firstName:parts[0]||"", lastName:parts.slice(1).join(" ")||"",
          email:currentUser.email||"", building:"", dropNotes:"",
          totalRentals:0, totalSaved:0, totalHours:0,
          notifications:{delivery:true,eta:true,returns:true,promo:false},
          createdAt:fb.serverTimestamp()
        };
        await fb.setDoc(pRef(currentUser.uid), userProfile);
      }
      // renderAccount not needed on this page
    } catch(e){ console.error("loadProfile",e); }
  }

  async function loadCart() {
    try {
      var snap = await fb.getDoc(cRef(currentUser.uid));
      if (snap.exists() && snap.data().items) {
        cart = snap.data().items; updateBadge();
        if (el("page-cart") && el("page-cart").classList.contains("active")) renderCart();
      }
    } catch(e){ console.error("loadCart",e); }
  }

  function subscribeOrders() {
    if (ordersUnsub) ordersUnsub();
    var q = fb.query(oCol(currentUser.uid), fb.orderBy("createdAt","desc"));
    ordersUnsub = fb.onSnapshot(q, function(snap){
      liveOrders = snap.docs.map(function(d){ return Object.assign({_id:d.id},d.data()); });
      var _po = el("page-orders"); if (_po && _po.classList.contains("active")) renderOrders();
    }, function(e){ console.error("orders",e); });
  }

  async function saveProfile(fields) {
    if (!currentUser) return;
    try {
      var update = Object.assign({}, fields, {updatedAt:fb.serverTimestamp()});
      await fb.updateDoc(pRef(currentUser.uid), update);
      userProfile = Object.assign({}, userProfile, fields);
      renderAccount(); showToast("✓ Saved");
    } catch(e){ showToast("Save failed"); console.error(e); }
  }

  // Real placeOrder
  window._realPlaceOrder = placeOrder = async function(items, dropLocation, stripePaymentId) {
    if (!currentUser) { showAuth(); return; }
    var total = parseFloat(items.reduce(function(s,i){return s+calcCost(i,i.hours);},0).toFixed(2));
    var saved = parseFloat(items.reduce(function(s,i){return s+(i.retail-calcCost(i,i.hours));},0).toFixed(2));
    var hrs   = items.reduce(function(s,i){return s+i.hours;},0);

  window.initAddrDropPin = function(lat, lng, viewport) {
    if (!window.google || !window.google.maps) return;
    var mapEl = el("addr-droppin-map");
    if (!mapEl) return;

    lat = lat || (userProfile && userProfile.dropLat) || 35.7847;
    lng = lng || (userProfile && userProfile.dropLng) || -78.6821;

    // House centre — use stored geocoded point, not the moveable drop pin
    var houseLat = window._addrHouseLat || lat;
    var houseLng = window._addrHouseLng || lng;
    var houseLLng = new window.google.maps.LatLng(houseLat, houseLng);

    // Drop pin starts at last saved position (or house if new)
    window._addrDropLat = lat;
    window._addrDropLng = lng;
    var dropLatLng = new window.google.maps.LatLng(lat, lng);

    function updateCoords(latv, lngv) {
      window._addrDropLat = latv;
      window._addrDropLng = lngv;
      var c = el("addr-droppin-coords");
      if (c) { c.textContent = latv.toFixed(6) + ", " + lngv.toFixed(6); c.style.color = "var(--muted)"; }
    }

    function drawPropertyBox(map) {
      if (window._addrPropertyBox) { window._addrPropertyBox.setMap(null); window._addrPropertyBox = null; }
      var R = 20;
      var dLat = R / 111320;
      var dLng = R / (111320 * Math.cos(houseLat * Math.PI / 180));
      var bounds = new window.google.maps.LatLngBounds(
        new window.google.maps.LatLng(houseLat - dLat, houseLng - dLng),
        new window.google.maps.LatLng(houseLat + dLat, houseLng + dLng)
      );
      window._addrPropertyBox = new window.google.maps.Rectangle({
        bounds: bounds, map: map,
        strokeColor: "#1a6ef0", strokeOpacity: 1, strokeWeight: 2.5,
        fillColor: "#1a6ef0", fillOpacity: 0.12,
        zIndex: 1, clickable: false
      });
    }

    if (window._addrGMap) {
      window._addrGMap.setCenter(houseLLng);
      window._addrGMap.setZoom(20);
      drawPropertyBox(window._addrGMap);
      if (window._addrHouseMarker) window._addrHouseMarker.setPosition(houseLLng);
      if (window._addrDropMarkerG) window._addrDropMarkerG.setPosition(dropLatLng);
      updateCoords(lat, lng);
      return;
    }

    window._addrGMap = new window.google.maps.Map(mapEl, {
      center: houseLLng,
      zoom: 20,
      mapTypeId: "satellite",
      tilt: 0,
      disableDefaultUI: false,
      zoomControl: true,
      mapTypeControl: false,
      streetViewControl: false,
      fullscreenControl: false
    });

    drawPropertyBox(window._addrGMap);

    // House marker — always fixed at geocoded centre
    window._addrHouseMarker = new window.google.maps.Marker({
      position: houseLLng,
      map: window._addrGMap,
      label: { text: "\u{1F3E0}", fontSize: "20px" },
      title: "Your house",
      zIndex: 10,
      clickable: false
    });

    // Draggable red drop pin — starts at last saved drop position
    window._addrDropMarkerG = new window.google.maps.Marker({
      position: dropLatLng,
      map: window._addrGMap,
      draggable: true,
      icon: {
        path: window.google.maps.SymbolPath.CIRCLE,
        scale: 10, fillColor: "#e53e3e", fillOpacity: 1,
        strokeColor: "#fff", strokeWeight: 3
      },
      title: "Landing spot",
      zIndex: 20
    });
    updateCoords(lat, lng);

    window._addrDropMarkerG.addListener("drag", function() {
      var p = window._addrDropMarkerG.getPosition();
      updateCoords(p.lat(), p.lng());
    });
    window._addrDropMarkerG.addListener("dragend", function() {
      var p = window._addrDropMarkerG.getPosition();
      updateCoords(p.lat(), p.lng());
    });
    window._addrGMap.addListener("click", function(e) {
      window._addrDropMarkerG.setPosition(e.latLng);
      updateCoords(e.latLng.lat(), e.latLng.lng());
    });
  };;;

// ── Theme toggle ─────────────────────────────────────────────────────────────
var _theme = (function(){ try { return localStorage.getItem("droveiaTheme") || "light"; } catch(e){ return "light"; } })();
function applyTheme(t, animate) {
  var html = document.documentElement;
  if (animate) {
    html.classList.add("theme-transitioning");
    setTimeout(function(){ html.classList.remove("theme-transitioning"); }, 500);
  }
  html.setAttribute("data-theme", t);
  var moon = document.getElementById("icon-moon");
  var sun  = document.getElementById("icon-sun");
  if (moon) moon.style.display = t === "dark" ? "none"  : "block";
  if (sun)  sun.style.display  = t === "dark" ? "block" : "none";
  _theme = t;
  try { localStorage.setItem("droveiaTheme", t); } catch(e){}
}
window.toggleTheme = function() {
  applyTheme(_theme === "dark" ? "light" : "dark", true);
};
// Apply saved theme immediately
applyTheme(_theme);

async function loadToolsFromRTDB() {
  try {
    var data = await fetch(RTDB_URL).then(function(r){ return r.json(); });
    var arr = !data ? [] : Array.isArray(data) ? data : Object.values(data);
    if (!arr.length) { console.log("No RTDB data"); return; }
    // Trim whitespace from all keys
    arr = arr.map(function(t) {
      if (!t) return null;
      var clean = {};
      Object.keys(t).forEach(function(k){ clean[k.trim()] = typeof t[k] === 'string' ? t[k].trim() : t[k]; });
      return clean;
    });
    TOOLS = arr.filter(function(t){ return t && t.name && t.retail; }).map(function(t, i) {
      return {
        id:        parseInt(t.id)        || (i+1),
        name:      t.name                || "Tool",
        cat:       t.cat                 || "Workshop",
        pph:       parseFloat(t.pph)     || 0,
        retail:    parseFloat(t.retail)  || 20,
        rating:    parseFloat(t.rating)  || 4.5,
        desc:      t.desc                || "",
        eta:       t.eta                 || "5 min",
        img:       t.img                 || "",
        qty:       parseInt(t.qty)       || 1,
        rentedQty: parseInt(t.rentedQty) || 0,
        available: (parseInt(t.qty) || 1) > (parseInt(t.rentedQty) || 0),
        partnerEmail: t.partnerEmail || null,
        partnerName:  t.partnerName  || null,
        type:         t.type     || 'rent',
        buyPrice:     parseFloat(t.buyPrice) || 0
      };
    });
    renderCatIcons();
    renderFeatured();
    renderTools();
    // Refresh admin inventory table if open
    var adminInv = el("admin-panel-inventory");
    if (adminInv && adminInv.classList.contains("active")) {
      adminInv.innerHTML = '<div id="admin-add-form-wrap"></div><div id="admin-edit-form-wrap"></div>' + adminInventoryTable();
    }
  } catch(e) {
    console.warn("RTDB load failed:", e);
  }
}

var _inventoryUnsub = null;


// When a tool is rented, mark unavailable in Firestore
async function markToolUnavailable(fb, toolId) {
  var tid = parseInt(toolId);
  var idx = TOOLS.findIndex(function(t){ return t.id === tid; });
  if (idx < 0) { console.warn("markToolUnavailable: tool not found", tid); return; }
  var qty       = parseInt(TOOLS[idx].qty) || 1;        // NEVER change this
  var rentedQty = (parseInt(TOOLS[idx].rentedQty) || 0) + 1;
  var available = rentedQty < qty;
  TOOLS[idx].rentedQty = rentedQty;
  TOOLS[idx].available = available;
  var url = "https://droveia-default-rtdb.firebaseio.com/tools/" + idx + ".json?auth=NKLKSY1Cshm1pba0vuKK6RQOmjV2uOfeje7hzxkI";
  try {
    await fetch(url, {
      method: "PATCH",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ rentedQty: rentedQty, available: available })
    });
    renderTools(); renderFeatured();
    // Refresh admin panel if open
    var adminInv = el("admin-panel-inventory");
    if (adminInv && adminInv.classList.contains("active")) {
      adminInv.innerHTML = '<div id="admin-add-form-wrap"></div><div id="admin-edit-form-wrap"></div>' + adminInventoryTable();
    }
  } catch(e) { console.error("markToolUnavailable error", e); }
}

async function markToolAvailable(fb, toolId) {
  var tid = parseInt(toolId);
  var idx = TOOLS.findIndex(function(t){ return t.id === tid; });
  if (idx < 0) { console.warn("markToolAvailable: tool not found", tid); return; }
  var qty       = parseInt(TOOLS[idx].qty) || 1;        // NEVER change this
  var rentedQty = Math.max(0, (parseInt(TOOLS[idx].rentedQty) || 1) - 1);
  var available = rentedQty < qty;
  TOOLS[idx].rentedQty = rentedQty;
  TOOLS[idx].available = available;
  var url = "https://droveia-default-rtdb.firebaseio.com/tools/" + idx + ".json?auth=NKLKSY1Cshm1pba0vuKK6RQOmjV2uOfeje7hzxkI";
  try {
    await fetch(url, {
      method: "PATCH",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ rentedQty: rentedQty, available: available })
    });
    renderTools(); renderFeatured();
    var adminInv = el("admin-panel-inventory");
    if (adminInv && adminInv.classList.contains("active")) {
      adminInv.innerHTML = '<div id="admin-add-form-wrap"></div><div id="admin-edit-form-wrap"></div>' + adminInventoryTable();
    }
  } catch(e) { console.error("markToolAvailable error", e); }
}

var _confirmCallback = null;

window.closeConfirm = function() {
  var m = document.getElementById('confirm-modal'); if(m) m.style.display="none";
};
window.showConfirm = function(opts) {
  var icon  = document.getElementById('confirm-icon');
  var title = document.getElementById('confirm-title');
  var msg   = document.getElementById('confirm-msg');
  var okBtn = document.getElementById('confirm-ok-btn');
  var color = opts.color || 'blue';
  var icons = { red:'✕', amber:'!', green:'✓', blue:'?' };
  if (icon)  { icon.className = 'confirm-box-icon ' + color; icon.textContent = icons[color] || '?'; }
  if (title) { title.textContent = opts.title || 'Are you sure?'; }
  if (msg)   { msg.textContent   = opts.msg   || ''; }
  if (okBtn) {
    okBtn.textContent = opts.okLabel || 'Confirm';
    var btnColors = {red:'#ef4444',amber:'#d97706',green:'#16a34a',blue:'#1a6ef0'};
    okBtn.style.background = btnColors[color]||'#1a6ef0';
    okBtn.style.color='#fff';
    okBtn.className = 'confirm-ok ' + color;
  }
  _confirmCallback = opts.onOk || null;
  window._confirmCallback = _confirmCallback;
  var cm = document.getElementById('confirm-modal');
  if (cm) { cm.classList.remove('hidden'); cm.style.display='flex'; }
};

window.closeConfirm = function() {
  var cm = document.getElementById('confirm-modal');
  if (cm) { cm.classList.add('hidden'); cm.style.display='none'; }
  _confirmCallback = null; window._confirmCallback = null;
};

window.confirmOk = function() {
  closeConfirm();
  if (_confirmCallback) { _confirmCallback(); _confirmCallback = null; }
};

// Close on backdrop click
document.addEventListener("click", function(e) {
  var modal = el("confirm-modal");
  if (modal && e.target === modal) closeConfirm();
});

// ── Reviews ──────────────────────────────────────────────────────────────────
var _reviewStar   = 0;
var _reviewToolId = null;
var _reviewToolName = "";
var _reviewOrderId  = null;
var _homeReviewsUnsub = null;

function reviewStars(r, size) {
  size = size || 14;
  var s = "";
  for (var i = 1; i <= 5; i++) {
    s += '<span class="review-star'+(i > r ? ' empty' : '')+'" style="font-size:'+size+'px">★</span>';
  }
  return '<div class="review-stars">'+s+'</div>';
}

window.openReviewModal = function(toolId, toolName, orderId) {
  if (typeof toolName === "string" && toolName.indexOf("%") >= 0) { try { toolName = decodeURIComponent(toolName); } catch(e){} }
  if (!currentUser) { showAuth(); return; }
  _reviewStar    = 0;
  _reviewToolId  = toolId !== undefined ? toolId : null;
  _reviewToolName = toolName;
  _reviewOrderId  = orderId;
  el("review-modal-title").textContent = "Review: " + toolName;
  el("review-modal-sub").textContent   = "Tell other students what you thought";
  el("review-text").value = "";
  qsa(".star-pick").forEach(function(s){ s.classList.remove("active"); });
  el("review-modal").classList.remove("hidden");
};

window.closeReviewModal = function() {
  el("review-modal").classList.add("hidden");
};

window.setReviewStar = function(n) {
  _reviewStar = n;
  qsa(".star-pick").forEach(function(s, i){
    s.classList.toggle("active", i < n);
  });
};

window.submitReview = async function() {
  if (!currentUser) return;
  if (!_reviewStar) { showToast("Please pick a star rating"); return; }
  var text = (el("review-text").value || "").trim();
  if (!text) { showToast("Please write a short review"); return; }
  var fb = window._fb;
  try {
    var first = (userProfile && userProfile.firstName) || 
                (currentUser.displayName || currentUser.email).split(/[\s@]/)[0];
    // Save review to Firestore — coerce all to safe types
    await fb.addDoc(fb.collection(fb.db, "reviews"), {
      toolId:    Number(_reviewToolId) || String(_reviewToolId || "unknown"),
      toolName:  String(_reviewToolName || "Tool"),
      orderId:   String(_reviewOrderId || ""),
      userId:    String(currentUser.uid),
      userName:  String(first || "Student"),
      rating:    Number(_reviewStar),
      text:      String(text),
      createdAt: fb.serverTimestamp()
    });
    // Update tool rating average in RTDB
    updateToolRatingRTDB(_reviewToolId, _reviewStar);
    closeReviewModal();
    showToast("✓ Review submitted!");
    // Mark this order item as reviewed
    markOrderItemReviewed(_reviewOrderId, 'order');
  } catch(e) {
    console.error("review", e);
    showToast("Failed to submit review");
  }
};

function updateToolRatingRTDB(toolId, newStar) {
  // Find tool in TOOLS array and update local rating
  for (var i = 0; i < TOOLS.length; i++) {
    if (TOOLS[i].id == toolId) {
      var oldRating = TOOLS[i].rating || 5;
      TOOLS[i].rating = parseFloat(((oldRating + newStar) / 2).toFixed(1));
      break;
    }
  }
}

function markOrderItemReviewed(orderId, toolId) {
  // Add to local set so button shows "Reviewed"
  var key = orderId + "_" + toolId;
  try { localStorage.setItem("reviewed_"+key, "1"); } catch(e) {}
  renderOrders();
}

function hasReviewed(orderId, toolId) {
  var key = orderId + "_" + toolId;
  try { return !!localStorage.getItem("reviewed_"+key); } catch(e) { return false; }
}
window.hasReviewed = hasReviewed;

// Subscribe to latest reviews for home page
function subscribeHomeReviews(fb) {
  if (_homeReviewsUnsub) _homeReviewsUnsub();
  var q = fb.query(
    fb.collection(fb.db, "reviews"),
    fb.orderBy("createdAt", "desc"),
    fb.limit(6)
  );
  _homeReviewsUnsub = fb.onSnapshot(q, function(snap) {
    var reviews = snap.docs.map(function(d){ return Object.assign({_id:d.id}, d.data()); });
    renderHomeReviews(reviews);
  });
}

function renderHomeReviews(reviews) {
  var g = el("home-reviews");
  if (!g) return;
  if (!reviews.length) {
    g.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted);font-size:14px">No reviews yet — be the first to rent and review!</div>';
    return;
  }
  g.innerHTML = reviews.map(function(r) {
    var initial = (r.userName || "S")[0].toUpperCase();
    var date = r.createdAt && r.createdAt.toDate ? r.createdAt.toDate().toLocaleDateString([], {month:"short",day:"numeric"}) : "";
    return '<div class="review-card">'+
      '<div class="review-card-header">'+
        '<div class="review-avatar">'+initial+'</div>'+
        '<div class="review-meta">'+
          '<div class="review-author">'+( r.userName || "Student" )+'</div>'+
          '<div class="review-tool">'+( r.toolName || "Tool" )+'</div>'+
        '</div>'+
        reviewStars(r.rating)+
      '</div>'+
      '<div class="review-text">'+r.text+'</div>'+
      '<div class="review-date">'+date+'</div>'+
    '</div>';
  }).join("");
}

window.adminLoadDeliveries = async function() {

  wrap.innerHTML = '<div style="color:var(--muted);font-size:14px;padding:20px">Loading API deliveries...</div>';
  var fb = window._fb; if (!fb) return;
  try {
    var snap = await fb.getDocs(
      fb.query(fb.collection(fb.db,"deliveries"), fb.orderBy("createdAt","desc"), fb.limit(100))
    );
    var all = snap.docs.map(function(d){ return Object.assign({_id:d.id}, d.data()); });
    var pending = all.filter(function(d){ return d.status==="pending_approval"; }).length;
    var badge = el("adlv-badge");
    if (badge) { badge.style.display = pending?"inline":"none"; badge.textContent = pending; }

    if (!all.length) {
      wrap.innerHTML = '<div style="text-align:center;padding:60px 0;color:var(--muted);font-size:14px">No API deliveries yet.<br><span style="font-size:12px;display:block;margin-top:6px">When a partner calls POST /v1/deliveries, orders appear here.</span></div>';
      return;

    var SC = { pending_approval:"#d97706", approved:"var(--blue)", dispatching:"var(--blue)", dispatched:"var(--blue)", delivered:"var(--green)", failed:"#ef4444", rejected:"#6b7280" };

    wrap.innerHTML =
      '<div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap">' +
        '<div style="font-size:15px;font-weight:700">API Deliveries</div>' +
        '<span style="font-size:12px;color:var(--muted)">' + all.length + ' total · ' + pending + ' pending approval</span>' +
      '</div>' +
      '<div style="display:grid;gap:10px">' + all.map(function(d) {
        var sc = SC[d.status]||"var(--muted)";
        var date = d.createdAt&&d.createdAt.toDate ? d.createdAt.toDate().toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
        var items = (d.items||[]).map(function(i){return i.name+(i.qty>1?" x"+i.qty:"");}).join(", ")||"—";
        var isPend = d.status==="pending_approval";
        return '<div style="background:var(--bg2);border:1px solid '+(isPend?"rgba(217,119,6,.4)":"var(--border)")+';border-radius:14px;padding:18px 20px'+(isPend?';box-shadow:0 0 0 2px rgba(217,119,6,.08)':'')+'">' +
          '<div style="display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap">' +
            '<div style="flex:1;min-width:200px">' +
              '<div style="font-weight:700;font-size:14px;margin-bottom:4px">' + (d.customerName||"—") + (d.customerPhone?' <span style="font-size:12px;color:var(--muted);font-weight:400">'+d.customerPhone+'</span>':'') + '</div>' +
              '<div style="font-size:13px;color:var(--text2);margin-bottom:3px">📦 ' + items + '</div>' +
              '<div style="font-size:12px;color:var(--muted)">📍 ' + (d.deliveryAddress||"—") + '</div>' +
              (d.notes?'<div style="font-size:12px;color:var(--muted);margin-top:2px">📝 '+d.notes+'</div>':'') +
              '<div style="font-size:11px;color:var(--dim);margin-top:8px">Partner: <strong>'+(d.partnerName||d.partnerEmail||"—")+'</strong> · Station: <strong>'+(d.stationId||"—")+'</strong>'+(date?' · '+date:'')+'</div>' +
            '</div>' +
            '<div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end;flex-shrink:0">' +
              '<span style="font-size:11px;font-weight:700;padding:4px 12px;border-radius:7px;white-space:nowrap;background:'+sc.replace("var(--","rgba(").replace(")",",0.1)")+';color:'+sc+'">'+(d.status||"").replace(/_/g," ")+'</span>' +
              (isPend
                ? '<div style="font-size:11px;color:#d97706;font-weight:600;margin-top:6px">⏳ Waiting for partner to confirm package is in station</div>' +
          +'<td>'+(isPending?'<button class="adm-btn-green" onclick="adminForceApprove(this.dataset.id)" data-id="'+d._id+'" style="font-size:11px;padding:5px 10px">Force Approve</button>':'—')+'</td>'

  }
};

window.adminApproveDelivery = async function(docId) {
  showConfirm({ title:"Approve Delivery?", msg:"Flips status to 'approved'. The docking station Pi will dispatch the drone automatically.", okLabel:"Approve", color:"green",
    onOk: async function() {
      var fb = window._fb;
      try {
        await fb.updateDoc(fb.doc(fb.db,"deliveries",docId), { status:"approved", approvedAt:fb.serverTimestamp(), updatedAt:fb.serverTimestamp() });

        adminLoadDeliveries();

};

window.adminRejectDelivery = async function(docId) {

        await fb.updateDoc(fb.doc(fb.db,"deliveries",docId), { status:"rejected", rejectedAt:fb.serverTimestamp(), updatedAt:fb.serverTimestamp() });
        showToast("Delivery rejected");
        adminLoadDeliveries();

window.adminApprovePartnerApp = async function(btn) {
  var docId=btn.dataset.aid, name=btn.dataset.aname, email=btn.dataset.aemail, logo=btn.dataset.alogo||null;
  showConfirm({ title:"Approve "+name+"?", msg:"Creates a partner account for "+email+".", okLabel:"Approve", color:"green",

      var fb=window._fb;
      try {
        await fb.addDoc(fb.collection(fb.db,"partners"),{name,email,logoUrl:logo,status:"active",createdAt:fb.serverTimestamp()});

    }
  });
};

window.admApproveInventory = async function(btn) {
  var docId = btn.dataset.id;
  var item = JSON.parse(decodeURIComponent(btn.dataset.item));
  var fb = window._fb;
  try {
    // 1. Reload fresh RTDB data first so we don't overwrite with stale TOOLS
    var liveData = await fetch('https://droveia-default-rtdb.firebaseio.com/tools.json?auth=NKLKSY1Cshm1pba0vuKK6RQOmjV2uOfeje7hzxkI').then(function(r){ return r.json(); });
    var liveArr = !liveData ? [] : Array.isArray(liveData) ? liveData : Object.values(liveData);
    liveArr = liveArr.filter(Boolean);

    // 2. Build new tool with a unique id
    var maxId = liveArr.reduce(function(m,t){ return Math.max(m, parseInt(t.id)||0); }, 0);
    var newTool = {
      id: maxId + 1,
      name: item.name, cat: item.cat, desc: item.desc||'',
      pph: parseFloat(item.pph)||0,
      retail: parseFloat(item.pph) ? parseFloat(item.pph)*20 : 20,
      type: item.type||'rent',
      buyPrice: parseFloat(item.buyPrice)||0,
      rating: 4.5, eta: '< 30 min',
      img: item.imgUrl||'x',
      qty: parseInt(item.qty)||1, rentedQty: 0,
      available: true,
      partnerEmail: item.partnerEmail||'',
      partnerName: item.partnerName||''
    };

    // 3. Append and write back
    liveArr.push(newTool);
    await fetch('https://droveia-default-rtdb.firebaseio.com/tools.json?auth=NKLKSY1Cshm1pba0vuKK6RQOmjV2uOfeje7hzxkI', {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(liveArr)
    });

    // 4. Update Firestore status
    await fb.updateDoc(fb.doc(fb.db,'pendingInventory',docId), {
      status: 'approved', approvedAt: fb.serverTimestamp(), rtdbId: newTool.id
    });

    // 5. Sync local TOOLS array
    await loadToolsFromRTDB();

    showToast('✓ ' + item.name + ' approved and live on store');

    // 6. Refresh partner stock view
    var wrap = document.getElementById('adm-content');
    if (wrap) await renderAdmPartnerStock(wrap);
  } catch(e) { showToast('Error: '+e.message); console.error(e); }
};

  var email   = (document.getElementById('np-email')||{value:''}).value.trim();
  var station = (document.getElementById('np-station')||{value:''}).value.trim();
  var logo    = (document.getElementById('np-logo')||{value:''}).value.trim();
  if (!name||!email) { showToast('Name and email required'); return; }
  var fb = window._fb;
  try {
    await fb.addDoc(fb.collection(fb.db,'partners'),{name,email,stationId:station,logoUrl:logo||null,status:'active',createdAt:fb.serverTimestamp()});
    showToast('✓ Partner added');
    admTab('partners', document.getElementById('adm-nav-partners'));
  } catch(e) { showToast('Error: '+e.message); }
};

window.admEditPartner = async function(id, name, email, stationId) {
  if (typeof id !== "string") { var el=id; id=el.dataset.id; name=el.dataset.name; email=el.dataset.email; stationId=el.dataset.station; }
  var newName    = prompt('Partner name:', name);
  if (newName === null) return;
  var newStation = prompt('Station ID:', stationId||'');
  if (newStation === null) return;
  var fb = window._fb;
  try {
    await fb.updateDoc(fb.doc(fb.db,'partners',id), {name:newName, stationId:newStation});
    showToast('✓ Partner updated');
    admTab('partners', document.getElementById('adm-nav-partners'));
  } catch(e) { showToast('Error: '+e.message); }
};

window.admRemovePartner = async function(id) {
  if (typeof id !== "string") id = id.dataset.id;
  if (!confirm('Remove this partner?')) return;
  var fb = window._fb;
  try {
    await fb.deleteDoc(fb.doc(fb.db,'partners',id));
    showToast('Partner removed');
    admTab('partners', document.getElementById('adm-nav-partners'));
  } catch(e) { showToast('Error: '+e.message); }
};

// ── APPLICATIONS ─────────────────────────────────────────────────────────────
window.renderAdmApplications = async function(wrap) {
  var fb = window._fb;
  try {
    var snap = await fb.getDocs(fb.query(fb.collection(fb.db,'partnerApplications'),fb.where('status','==','pending')));
    var apps = snap.docs.map(function(d){return Object.assign({_id:d.id},d.data());});
    wrap.innerHTML = '<div class="adm-card"><div class="adm-card-header"><div class="adm-card-title">Partner Applications ('+apps.length+')</div></div>'
      +'<div style="overflow-x:auto"><table class="adm-table"><thead><tr><th>Business</th><th>Email</th><th>Message</th><th>Date</th><th>Actions</th></tr></thead><tbody>'
      +(apps.length ? apps.map(function(a){
        var date=a.createdAt&&a.createdAt.toDate?a.createdAt.toDate().toLocaleDateString([],{month:'short',day:'numeric'}):'';
        return '<tr>'
          +'<td><strong>'+a.businessName+'</strong></td>'
          +'<td style="font-size:12px">'+a.email+'</td>'
          +'<td style="font-size:12px;max-width:200px">'+( a.message||'—')+'</td>'
          +'<td style="font-size:11px;color:#9ca3af">'+date+'</td>'
          +'<td style="display:flex;gap:6px">'
          +'<button class="adm-btn-green" onclick="admApproveApp(this.dataset.id,this.dataset.name,this.dataset.email)" data-id="'+a._id+'" data-name="'+a.businessName+'" data-email="'+a.email+'" style="font-size:11px;padding:5px 10px">✓ Approve</button>'
          +'<button class="adm-btn-danger" onclick="admRejectApp(this.dataset.id)" data-id="'+a._id+'" style="font-size:11px;padding:5px 10px">Reject</button>'
          +'</td></tr>';
      }).join('') : '<tr><td colspan="5" style="text-align:center;padding:32px;color:#9ca3af">No pending applications.</td></tr>')
      +'</tbody></table></div></div>';
  } catch(e) { wrap.innerHTML = '<div style="color:#ef4444;padding:20px">Error: '+e.message+'</div>'; }
};

window.admApproveApp = async function(id, name, email) {
  if (typeof id !== "string") { var el=id; id=el.dataset.id; name=el.dataset.name; email=el.dataset.email; }
  var fb = window._fb;
  try {
    var station = prompt('Assign station ID:', 'STN00'+Math.floor(Math.random()*99));
    if (!station) return;
    await fb.addDoc(fb.collection(fb.db,'partners'),{name,email,stationId:station,status:'active',createdAt:fb.serverTimestamp()});
    await fb.updateDoc(fb.doc(fb.db,'partnerApplications',id),{status:'approved'});
    showToast('✓ Partner approved');
    admTab('applications', document.getElementById('adm-nav-applications'));
  } catch(e) { showToast('Error: '+e.message); }
};

window.admRejectApp = async function(id) {
  if (typeof id !== "string") id = id.dataset.id;
  var fb = window._fb;
  try {
    await fb.updateDoc(fb.doc(fb.db,'partnerApplications',id),{status:'rejected'});
    showToast('Application rejected');
    admTab('applications', document.getElementById('adm-nav-applications'));
  } catch(e) { showToast('Error: '+e.message); }
};

</script>
<script>

function initAdminPage() {
  var fb = window._fb;
  fb.onAuthStateChanged(fb.auth, async function(user) {
    if (user) {
      var btn = document.getElementById('nav-auth-btn');
      if (btn) { btn.textContent = (user.displayName||user.email).split(/[\s@]/)[0]; btn.onclick = function(){ doSignOut(); window.location.href='/'; }; }
      var nameEl = document.getElementById('adm-user-name');
      if (nameEl) nameEl.textContent = user.displayName || user.email;
      await loadAdminEmails();
      await loadToolsFromRTDB();
      isAdmin = checkAdmin();
      if (!isAdmin) {
        var wrap = document.getElementById('adm-content');
        if (wrap) wrap.innerHTML = '<div style="text-align:center;padding:80px"><p style="color:#ef4444;margin-bottom:16px;font-weight:600">Access denied — not an admin account.</p></div>';
        return;
      }
      admTab('inventory', document.getElementById('adm-nav-inventory'));
    } else {
      var btn = document.getElementById('nav-auth-btn');
      if (btn) { btn.textContent = 'Sign In'; btn.onclick = showAuth; }
      var wrap = document.getElementById('adm-content');
      if (wrap) wrap.innerHTML = '<div style="text-align:center;padding:80px"><p style="color:#9ca3af;margin-bottom:16px">Sign in with an admin account.</p><button class="adm-btn" onclick="showAuth()">Sign In</button></div>';
    }
  });
}
if (window._fbReady) { initAdminPage(); }
else { document.addEventListener('fbready', initAdminPage, {once:true}); }

</script>

<!-- Confirm Modal -->
<div class="hidden" id="confirm-modal" style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:2000;display:none;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:14px;padding:28px;max-width:380px;width:90%">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
      <div id="confirm-icon" style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;flex-shrink:0"></div>
      <div id="confirm-title" style="font-size:16px;font-weight:800;color:#111"></div>
    </div>
    <div id="confirm-msg" style="font-size:13px;color:#6b7280;margin-bottom:20px"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button onclick="closeConfirm()" style="background:#f4f4f4;border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font)">Cancel</button>
      <button id="confirm-ok-btn" onclick="if(window._confirmCallback){window._confirmCallback();}closeConfirm();" style="border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font)">Confirm</button>
    </div>
  </div>
</div>
</body>
