<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DropKit — Tools Delivered</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        :root{
          --bg:#0b0b10;
          --panel:#11111a;
          --panel2:#0f0f16;
          --card:#141421;
          --stroke:rgba(255,255,255,.10);
          --text:#f4f4fb;
          --muted:rgba(244,244,251,.72);
          --muted2:rgba(244,244,251,.55);
          --brand1:#6d5efc;
          --brand2:#32d3ff;
          --good:#46f2a3;
          --warn:#ffcc66;
          --bad:#ff6b6b;

          --shadow: 0 30px 90px rgba(0,0,0,.55);
          --radius-xl: 22px;
          --radius-lg: 18px;
          --radius-md: 14px;
          --radius-sm: 12px;
        }

        *{ box-sizing:border-box; }
        html,body{ height:100%; }
        body{
          margin:0;
          font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
          background:
            radial-gradient(900px 450px at 20% -10%, rgba(109,94,252,.25), transparent 60%),
            radial-gradient(900px 450px at 90% 0%, rgba(50,211,255,.18), transparent 55%),
            var(--bg);
          color:var(--text);
        }
        a{ color:inherit; text-decoration:none; }
        button,input,textarea{ font-family:inherit; }
        .container{ width:min(1220px, 100%); margin:0 auto; padding:0 16px; }

        /* Header */
        .header{
          position:sticky; top:0; z-index:60;
          background:rgba(8,8,12,.72);
          border-bottom:1px solid var(--stroke);
          backdrop-filter: blur(10px);
        }
        .headerTop{
          display:flex; align-items:center; gap:12px;
          padding:12px 0;
        }

        .logo{
          display:flex; align-items:center; gap:10px;
          font-weight:900; letter-spacing:-.5px;
          cursor:pointer;
          user-select:none;
        }
        .logoDot{
          width:11px; height:11px; border-radius:50%;
          background:linear-gradient(135deg,var(--brand1),var(--brand2));
          box-shadow:0 0 0 4px rgba(109,94,252,.16);
        }

        .searchBar{
          flex:1;
          display:flex; align-items:center; gap:10px;
          background:rgba(255,255,255,.06);
          border:1px solid var(--stroke);
          height:44px; padding:0 12px;
          border-radius:16px;
          min-width: 220px;
        }
        .searchBar input{
          width:100%;
          border:0; outline:none;
          background:transparent; color:var(--text);
          font-size:14px;
        }

        .headerActions{ display:flex; gap:10px; align-items:center; }
        .pill{
          height:36px;
          border-radius:999px;
          border:1px solid var(--stroke);
          background:rgba(255,255,255,.06);
          color:var(--text);
          padding:0 12px;
          cursor:pointer;
          font-weight:800;
          font-size:12px;
          display:inline-flex; align-items:center; gap:8px;
          user-select:none;
        }
        .pill.primary{
          border:0;
          background:linear-gradient(135deg,var(--brand1),var(--brand2));
          color:#0b0b10;
        }
        .iconBtn{
          height:44px; width:44px;
          border-radius:16px;
          border:1px solid var(--stroke);
          background:rgba(255,255,255,.06);
          color:var(--text);
          display:grid; place-items:center;
          cursor:pointer;
          position:relative;
        }
        .badge{
          position:absolute;
          right:-6px; top:-6px;
          min-width:18px; height:18px; padding:0 6px;
          border-radius:999px;
          background:linear-gradient(135deg,var(--brand1),var(--brand2));
          color:#0b0b10;
          font-weight:900;
          font-size:11px;
          display:grid; place-items:center;
          border:1px solid rgba(0,0,0,.25);
        }

        .navRow{
          display:flex; gap:8px; align-items:center;
          padding:10px 0 12px;
          overflow:auto;
          scrollbar-width: none;
        }
        .navRow::-webkit-scrollbar{ display:none; }

        .navLink{
          height:34px;
          padding:0 12px;
          border-radius:999px;
          border:1px solid var(--stroke);
          background:rgba(255,255,255,.05);
          color:var(--muted);
          cursor:pointer;
          font-weight:900;
          font-size:12px;
          display:inline-flex; align-items:center; gap:8px;
          white-space:nowrap;
        }
        .navLink.active{
          color:#0b0b10;
          border-color:transparent;
          background:linear-gradient(135deg,var(--brand1),var(--brand2));
        }

        /* Layout */
        .main{ padding:18px 0 36px; }
        .grid{
          display:grid;
          grid-template-columns: 280px 1fr 360px;
          gap:14px;
          align-items:start;
        }
        @media (max-width:1100px){
          .grid{ grid-template-columns: 280px 1fr; }
          .rightCol{ display:none; }
          .mobileCartBtn{ display:grid !important; }
        }
        @media (min-width:1101px){ .mobileCartBtn{ display:none !important; } }
        @media (max-width:860px){
          .grid{ grid-template-columns:1fr; }
          .leftCol{ order:2; }
        }

        /* Panels/cards */
        .panel{
          background:rgba(255,255,255,.05);
          border:1px solid var(--stroke);
          border-radius:var(--radius-lg);
          overflow:hidden;
        }
        .panelHd{
          padding:14px 14px 10px;
          border-bottom:1px solid rgba(255,255,255,.06);
          display:flex; align-items:center; justify-content:space-between;
          gap:10px;
        }
        .panelTitle{ font-weight:950; letter-spacing:-.35px; }
        .muted{ color:var(--muted); font-size:12px; }

        /* Home sections */
        .hero{
          background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
          border:1px solid rgba(255,255,255,.10);
          border-radius:var(--radius-xl);
          padding:18px;
          box-shadow: var(--shadow);
        }
        .heroGrid{
          display:grid;
          grid-template-columns: 1.15fr .85fr;
          gap:14px;
          align-items:stretch;
        }
        @media (max-width:860px){ .heroGrid{ grid-template-columns:1fr; } }

        .heroTitle{
          font-size:34px;
          line-height:1.05;
          letter-spacing:-1px;
          font-weight:950;
          margin:0;
        }
        .heroSub{
          margin-top:10px;
          color:var(--muted);
          line-height:1.5;
          max-width:60ch;
          font-size:14px;
        }
        .heroCtas{ margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; }

        .miniCards{
          display:grid;
          grid-template-columns:1fr;
          gap:10px;
        }
        .mini{
          padding:12px;
          border-radius:var(--radius-lg);
          background:rgba(0,0,0,.16);
          border:1px solid rgba(255,255,255,.08);
        }
        .miniTop{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
        .miniTitle{ font-weight:950; letter-spacing:-.25px; }
        .miniText{ margin-top:6px; color:var(--muted); font-size:12px; line-height:1.45; }

        /* Categories left */
        .catList{ padding:12px; display:flex; flex-direction:column; gap:8px; }
        .catItem{
          height:42px; border-radius:16px;
          border:1px solid rgba(255,255,255,.08);
          background:rgba(0,0,0,.16);
          color:var(--muted);
          display:flex; align-items:center; justify-content:space-between;
          padding:0 12px;
          cursor:pointer;
          font-weight:950;
          font-size:13px;
        }
        .catItem.active{
          color:#0b0b10;
          background:linear-gradient(135deg,var(--brand1),var(--brand2));
          border-color:transparent;
        }
        .catLeft{ display:flex; align-items:center; gap:10px; }

        /* Tool cards */
        .cards{ padding:12px; display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:10px; }
        @media (max-width:1200px){ .cards{ grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width:860px){ .cards{ grid-template-columns: 1fr; } }

        .tool{
          background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
          border:1px solid rgba(255,255,255,.10);
          border-radius:16px;
          padding:14px;
          cursor:pointer;
          transition: transform .12s ease, border-color .12s ease;
        }
        .tool:hover{ transform: translateY(-1px); border-color:rgba(109,94,252,.38); }
        .toolTop{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
        .toolName{ font-weight:950; letter-spacing:-.35px; }
        .toolMeta{ margin-top:6px; color:var(--muted); font-size:12px; line-height:1.4; min-height:34px; }
        .toolRow{ margin-top:10px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
        .price{ font-weight:950; letter-spacing:-.2px; }
        .price small{ color:var(--muted); font-weight:800; }
        .add{
          height:36px; padding:0 12px;
          border-radius:12px;
          border:1px solid rgba(255,255,255,.12);
          background:rgba(255,255,255,.08);
          color:var(--text);
          cursor:pointer;
          font-weight:950;
          font-size:12px;
        }
        .add:hover{ border-color:rgba(50,211,255,.38); }

        .stars{ display:inline-flex; align-items:center; gap:2px; color:var(--warn); }
        .starsText{ color:var(--muted); font-size:12px; margin-left:6px; font-weight:800; }

        /* Cart */
        .cartBody{ padding:12px; display:flex; flex-direction:column; gap:10px; }
        .cartItem{
          display:flex; gap:10px; align-items:flex-start;
          padding:10px;
          border-radius:16px;
          background:rgba(0,0,0,.18);
          border:1px solid rgba(255,255,255,.08);
        }
        .cartName{ font-weight:950; letter-spacing:-.25px; font-size:13px; }
        .cartSub{ margin-top:4px; color:var(--muted); font-size:12px; }
        .qtyRow{ margin-top:10px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
        .qty{
          display:flex; align-items:center; gap:8px;
          border:1px solid rgba(255,255,255,.12);
          background:rgba(255,255,255,.06);
          border-radius:12px;
          padding:6px 8px;
          color:var(--muted);
          font-weight:900;
        }
        .qty input{
          width:58px;
          border:0; outline:none;
          background:transparent;
          color:var(--text);
        }
        .del{ border:0; background:none; color:rgba(255,255,255,.75); cursor:pointer; font-weight:950; }
        .totals{
          margin-top:6px;
          padding:12px;
          border-top:1px solid rgba(255,255,255,.06);
          display:flex; flex-direction:column; gap:8px;
        }
        .totalLine{ display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-weight:900; }
        .totalLine strong{ color:var(--text); }
        .checkout{
          margin-top:8px;
          height:44px;
          border-radius:16px;
          border:0;
          background:linear-gradient(135deg,var(--brand1),var(--brand2));
          color:#0b0b10;
          cursor:pointer;
          font-weight:950;
        }
        .checkout:disabled{ opacity:.5; cursor:not-allowed; }

        /* Orders */
        .orders{ padding:12px; display:flex; flex-direction:column; gap:10px; }
        .order{
          padding:12px;
          border-radius:16px;
          background:rgba(0,0,0,.18);
          border:1px solid rgba(255,255,255,.08);
          display:flex; flex-direction:column; gap:10px;
        }
        .orderTop{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
        .orderId{ font-weight:950; letter-spacing:-.25px; }
        .orderMeta{ color:var(--muted); font-size:12px; }
        .bar{
          height:8px; border-radius:999px;
          background:rgba(255,255,255,.08);
          overflow:hidden;
          border:1px solid rgba(255,255,255,.10);
        }
        .bar > div{
          height:100%;
          background:linear-gradient(135deg,var(--brand1),var(--brand2));
          width:0%;
        }

        /* Help / Contact */
        .helpWrap{ padding:12px; }
        .helpGrid{
          display:grid;
          grid-template-columns: 1fr 1fr;
          gap:10px;
        }
        @media (max-width:860px){ .helpGrid{ grid-template-columns:1fr; } }

        .card{
          padding:14px;
          border-radius:18px;
          background:rgba(0,0,0,.18);
          border:1px solid rgba(255,255,255,.08);
        }
        .card h3{ margin:0; font-size:14px; letter-spacing:-.2px; }
        .card p{ margin:8px 0 0; color:var(--muted); font-size:13px; line-height:1.5; }

        .form{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
        .field{ display:flex; flex-direction:column; gap:6px; }
        .label{ font-size:12px; color:var(--muted2); font-weight:800; }
        .input, textarea{
          border-radius:14px;
          border:1px solid rgba(255,255,255,.12);
          background:rgba(255,255,255,.06);
          color:var(--text);
          outline:none;
          padding:10px 12px;
        }
        textarea{ min-height:120px; resize:vertical; }
        .input:focus, textarea:focus{
          border-color:rgba(109,94,252,.55);
          box-shadow:0 0 0 4px rgba(109,94,252,.18);
        }
        .smallNote{ color:var(--muted); font-size:12px; margin-top:8px; }

        /* Footer */
        footer{
          margin-top:22px;
          border-top:1px solid rgba(255,255,255,.08);
          padding:20px 0 30px;
          color:var(--muted);
          font-size:12px;
        }
        .footerGrid{
          display:grid;
          grid-template-columns: 1.2fr 1fr 1fr 1fr;
          gap:12px;
        }
        @media (max-width:860px){ .footerGrid{ grid-template-columns:1fr 1fr; } }
        .fTitle{ color:var(--text); font-weight:900; margin-bottom:10px; }
        .fLink{ display:block; padding:6px 0; color:var(--muted); }
        .fLink:hover{ color:var(--text); }

        /* Toast + Drawer */
        .toast{
          position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
          padding:10px 12px;
          background:rgba(0,0,0,.75);
          border:1px solid rgba(255,255,255,.12);
          border-radius:999px;
          color:var(--text);
          font-weight:900;
          z-index:200;
          backdrop-filter: blur(10px);
        }
        .drawerBg{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:120; }
        .drawer{
          position:fixed; left:0; right:0; bottom:0;
          background:rgba(17,17,26,.98);
          border-top:1px solid rgba(255,255,255,.12);
          border-radius:18px 18px 0 0;
          z-index:130;
          max-height:82vh;
          overflow:auto;
          padding-bottom:18px;
        }

        /* Tiny helpers */
        .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
        .sep{ height:1px; background:rgba(255,255,255,.08); margin:10px 0; }
    </style>
</head>

<body>
<header class="header">
    <div class="container">
        <div class="headerTop">
            <div class="logo" id="goHome">
                <span class="logoDot"></span>
                <span>DropKit</span>
            </div>

            <div class="searchBar">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(244,244,251,.75)" stroke-width="2" stroke-linecap="round">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="M20 20l-3.5-3.5"></path>
                </svg>
                <input id="search" placeholder="Search tools, kits, electronics…" />
            </div>

            <div class="headerActions">
                <button class="pill primary" id="shopNow">Shop</button>
                <button class="pill" id="helpBtn">Help</button>

                <button class="iconBtn mobileCartBtn" id="openCartMobile" title="Cart">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M6 6h15l-2 9H7L6 6z"></path>
                        <path d="M6 6l-2-2"></path>
                        <circle cx="9" cy="20" r="1"></circle>
                        <circle cx="18" cy="20" r="1"></circle>
                    </svg>
                    <span class="badge" id="cartBadge" style="display:none;">0</span>
                </button>
            </div>
        </div>

        <div class="navRow" id="navRow">
            <button class="navLink active" data-route="home">Home</button>
            <button class="navLink" data-route="shop">Shop</button>
            <button class="navLink" data-route="orders">Orders</button>
            <button class="navLink" data-route="help">Contact Us</button>
            <button class="navLink" data-route="about">About</button>
        </div>
    </div>
</header>

<main class="main">
    <div class="container" id="app"></div>
</main>

<footer>
    <div class="container">
        <div class="footerGrid">
            <div>
                <div class="fTitle">DropKit</div>
                <div class="muted">Tools delivered when you need them. Pay hourly. Return easy.</div>
                <div class="smallNote">© <span id="year"></span> DropKit</div>
            </div>
            <div>
                <div class="fTitle">Shop</div>
                <a class="fLink" href="#shop" data-route="shop">Browse tools</a>
                <a class="fLink" href="#orders" data-route="orders">Track orders</a>
            </div>
            <div>
                <div class="fTitle">Support</div>
                <a class="fLink" href="#help" data-route="help">Contact Us</a>
                <a class="fLink" href="#help" data-route="help">FAQ</a>
            </div>
            <div>
                <div class="fTitle">Company</div>
                <a class="fLink" href="#about" data-route="about">About</a>
                <a class="fLink" href="#about" data-route="about">Safety</a>
            </div>
        </div>
    </div>
</footer>

<div id="toast" class="toast" style="display:none;"></div>

<div id="drawerWrap" style="display:none;">
    <div class="drawerBg" id="closeDrawer"></div>
    <div class="drawer" id="drawer"></div>
</div>

<script>
    // ─────────────────────────────────────────────
    // Data
    // ─────────────────────────────────────────────
    const TOOLS = [
      { id: 1, name: "Heat Gun", category: "Workshop", pricePerHr: 4.5, retail: 45, rating: 4.8, reviews: 124, desc: "1500W dual-temp · shrink wrap & crafts", eta: "8 min" },
      { id: 2, name: "Drill Kit", category: "Workshop", pricePerHr: 6.0, retail: 80, rating: 4.9, reviews: 310, desc: "20V cordless · 18-piece bit set included", eta: "6 min" },
      { id: 3, name: "Sewing Machine", category: "Crafts", pricePerHr: 5.0, retail: 90, rating: 4.7, reviews: 87, desc: "Compact 12-stitch · clothing repairs", eta: "10 min" },
      { id: 4, name: "Label Maker", category: "Office", pricePerHr: 2.0, retail: 30, rating: 4.6, reviews: 203, desc: "Thermal printer · USB & Bluetooth", eta: "5 min" },
      { id: 5, name: "Soldering Iron", category: "Electronics", pricePerHr: 3.5, retail: 40, rating: 4.8, reviews: 156, desc: "60W adjustable station · tips & flux", eta: "7 min" },
      { id: 6, name: "Jigsaw", category: "Workshop", pricePerHr: 7.0, retail: 95, rating: 4.9, reviews: 98, desc: "Compact · 5 blades included", eta: "9 min" },
      { id: 7, name: "Embroidery Set", category: "Crafts", pricePerHr: 1.5, retail: 18, rating: 4.5, reviews: 64, desc: "6-piece bamboo hoops · starter thread", eta: "4 min" },
      { id: 8, name: "Laminator", category: "Office", pricePerHr: 2.5, retail: 35, rating: 4.7, reviews: 179, desc: "9-inch · 20 pouches · 3-min warmup", eta: "6 min" },
      { id: 9, name: "Oscilloscope", category: "Electronics", pricePerHr: 8.0, retail: 120, rating: 4.9, reviews: 41, desc: "2-channel 50MHz digital", eta: "12 min" },
      { id: 10, name: "Hot Glue Gun", category: "Crafts", pricePerHr: 1.0, retail: 15, rating: 4.6, reviews: 220, desc: "High-temp · 20 glue sticks", eta: "5 min" },
      { id: 11, name: "Multimeter", category: "Electronics", pricePerHr: 2.0, retail: 28, rating: 4.8, reviews: 190, desc: "Auto-ranging digital", eta: "6 min" },
      { id: 12, name: "Staple Gun", category: "Workshop", pricePerHr: 2.5, retail: 32, rating: 4.5, reviews: 88, desc: "Heavy-duty · 1000 staples included", eta: "5 min" },
    ];
    const CATS = ["All", "Workshop", "Crafts", "Office", "Electronics"];
    const ORDERS = [
      { id: "#D-2041", name: "Drill Kit", status: "In Flight", eta: "3 min", time: "2:14 PM", progress: 0.7 },
      { id: "#D-2038", name: "Label Maker", status: "Delivered", eta: null, time: "1:05 PM", progress: 1 },
      { id: "#D-2031", name: "Soldering Iron", status: "Delivered", eta: null, time: "Yesterday", progress: 1 },
    ];

    // ─────────────────────────────────────────────
    // State
    // ─────────────────────────────────────────────
    const state = {
      route: "home", // home | shop | orders | help | about
      cat: "All",
      search: "",
      cart: [],
      hours: {},
    };

    const app = document.getElementById("app");
    const toastEl = document.getElementById("toast");
    const cartBadge = document.getElementById("cartBadge");
    document.getElementById("year").textContent = new Date().getFullYear();

    function esc(s){
      return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }

    function toast(msg){
      toastEl.textContent = msg;
      toastEl.style.display = "block";
      clearTimeout(toast._t);
      toast._t = setTimeout(()=> toastEl.style.display = "none", 1000);
    }

    function setRoute(r){
      state.route = r;
      // highlight nav
      document.querySelectorAll(".navLink").forEach(b => {
        b.classList.toggle("active", b.dataset.route === r);
      });
      render();
      // optional: scroll top
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function filteredTools(){
      const q = state.search.trim().toLowerCase();
      return TOOLS.filter(t =>
        (state.cat === "All" || t.category === state.cat) &&
        t.name.toLowerCase().includes(q)
      );
    }

    function getHours(id){ return state.hours[id] ?? 4; }

    function addToCart(tool){
      const h = getHours(tool.id);
      const ex = state.cart.find(c => c.id === tool.id);
      if (ex){
        state.cart = state.cart.map(c => c.id === tool.id ? { ...c, hours: h } : c);
      } else {
        state.cart = [...state.cart, { ...tool, hours: h }];
      }
      toast(`${tool.name} added`);
      syncCartBadge();
      render();
    }

    function removeFromCart(id){
      state.cart = state.cart.filter(x => x.id !== id);
      syncCartBadge();
      render();
    }

    function cartTotal(){
      return state.cart.reduce((s,c) => s + c.pricePerHr * c.hours, 0);
    }

    function savedTotal(){
      return state.cart.reduce((s,c) => s + (c.retail - c.pricePerHr * c.hours), 0);
    }

    function syncCartBadge(){
      if (state.cart.length > 0){
        cartBadge.style.display = "grid";
        cartBadge.textContent = String(state.cart.length);
      } else {
        cartBadge.style.display = "none";
      }
    }

    function stars(rating){
      const full = Math.floor(rating);
      let out = `<span class="stars" title="${rating.toFixed(1)}">`;
      for (let i=1;i<=5;i++){
        out += `
          <svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
              fill="${i<=full ? "currentColor" : "none"}"
              stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          </svg>`;
      }
      out += `<span class="starsText">${rating.toFixed(1)}</span></span>`;
      return out;
    }

    // ─────────────────────────────────────────────
    // Views
    // ─────────────────────────────────────────────
    function viewHome(){
      const featured = TOOLS.slice(0, 6);
      return `
        <div class="hero">
          <div class="heroGrid">
            <div>
              <h1 class="heroTitle">Rent tools like you buy on Amazon.</h1>
              <div class="heroSub">
                Need a heat gun for 30 minutes? A drill for a weekend? DropKit delivers fast, you pay hourly, and returns are simple.
              </div>
              <div class="heroCtas">
                <button class="pill primary" id="ctaShop">Browse tools</button>
                <button class="pill" id="ctaHelp">How it works</button>
                <span class="pill" style="cursor:default;">
                  <span style="width:8px;height:8px;border-radius:999px;background:var(--good);display:inline-block;"></span>
                  Available now
                </span>
              </div>

              <div class="sep"></div>

              <div class="muted" style="font-weight:900; margin-bottom:10px;">Popular right now</div>
              <div class="cards" style="padding:0;">
                ${featured.map(t => `
                  <div class="tool" data-add="${t.id}" title="Click to add to cart">
                    <div class="toolTop">
                      <div>
                        <div class="toolName">${esc(t.name)}</div>
                        <div class="muted" style="margin-top:6px;">${esc(t.category)} • ETA ${esc(t.eta)}</div>
                      </div>
                      ${stars(t.rating)}
                    </div>
                    <div class="toolMeta">${esc(t.desc)}</div>
                    <div class="toolRow">
                      <div class="price">$${t.pricePerHr.toFixed(2)} <small>/ hr</small></div>
                      <button class="add" data-add-btn="${t.id}" type="button">Add</button>
                    </div>
                  </div>
                `).join("")}
              </div>
            </div>

            <div class="miniCards">
              <div class="mini">
                <div class="miniTop">
                  <div class="miniTitle">Fast ETA</div>
                  <div class="pill" style="cursor:default;">4–12 min</div>
                </div>
                <div class="miniText">Nearby inventory + quick dispatch. Track deliveries from the Orders page.</div>
              </div>

              <div class="mini">
                <div class="miniTop">
                  <div class="miniTitle">Pay hourly</div>
                  <div class="pill" style="cursor:default;">No ownership</div>
                </div>
                <div class="miniText">You don’t need to buy a soldering station for one project. Rent it, return it.</div>
              </div>

              <div class="mini">
                <div class="miniTop">
                  <div class="miniTitle">Easy returns</div>
                  <div class="pill" style="cursor:default;">Pickup</div>
                </div>
                <div class="miniText">Schedule a pickup window. We’ll handle retrieval (demo UI for now).</div>
              </div>

              <div class="mini">
                <div class="miniTop">
                  <div class="miniTitle">Need help?</div>
                  <button class="pill primary" id="miniContact">Contact us</button>
                </div>
                <div class="miniText">Questions about eligibility, safety, or delivery areas? Hit Contact Us.</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function viewShop(){
      const tools = filteredTools();
      return `
        <div class="grid">
          <div class="leftCol panel">
            <div class="panelHd">
              <div>
                <div class="panelTitle">Categories</div>
                <div class="muted">Filter tools</div>
              </div>
              <button class="pill" data-cat="All">Reset</button>
            </div>
            <div class="catList">
              ${CATS.map(c => {
                const count = (c==="All") ? TOOLS.length : TOOLS.filter(t=>t.category===c).length;
                return `
                  <div class="catItem ${state.cat===c ? "active":""}" data-cat="${esc(c)}">
                    <div class="catLeft"><span>${esc(c)}</span></div>
                    <span style="opacity:.9;font-size:12px;">${count}</span>
                  </div>
                `;
              }).join("")}
            </div>
          </div>

          <div class="panel">
            <div class="panelHd">
              <div>
                <div class="panelTitle">Shop</div>
                <div class="muted">${tools.length} result${tools.length===1?"":"s"} • typical ETA 4–12 min</div>
              </div>
              <div class="muted" style="font-weight:900;">
                <span style="width:8px;height:8px;border-radius:999px;background:var(--good);display:inline-block;vertical-align:middle;margin-right:6px;"></span>
                Available now
              </div>
            </div>

            <div class="cards">
              ${tools.map(t => `
                <div class="tool" data-add="${t.id}">
                  <div class="toolTop">
                    <div>
                      <div class="toolName">${esc(t.name)}</div>
                      <div class="muted" style="margin-top:6px;">${esc(t.category)} • ETA ${esc(t.eta)}</div>
                    </div>
                    ${stars(t.rating)}
                  </div>
                  <div class="toolMeta">${esc(t.desc)}</div>
                  <div class="toolRow">
                    <div class="price">$${t.pricePerHr.toFixed(2)} <small>/ hr</small></div>
                    <button class="add" data-add-btn="${t.id}" type="button">Add</button>
                  </div>
                  <div class="muted" style="margin-top:8px;">${t.reviews} reviews · retail ≈ $${t.retail}</div>
                </div>
              `).join("")}
            </div>
          </div>

          <div class="rightCol panel">
            <div class="panelHd">
              <div>
                <div class="panelTitle">Cart</div>
                <div class="muted">${state.cart.length ? `${state.cart.length} item${state.cart.length===1?"":"s"}` : "Empty"}</div>
              </div>
              <button class="pill" id="clearCart" ${state.cart.length ? "" : "disabled"}>Clear</button>
            </div>
            ${viewCartPanel()}
          </div>
        </div>
      `;
    }

    function viewCartPanel(){
      const items = state.cart.length ? state.cart.map(c => {
        const h = state.hours[c.id] ?? c.hours ?? 4;
        const line = (c.pricePerHr * h).toFixed(2);
        return `
          <div class="cartItem">
            <div style="flex:1;">
              <div class="cartName">${esc(c.name)}</div>
              <div class="cartSub">$${c.pricePerHr.toFixed(2)}/hr · ETA ${esc(c.eta)}</div>

              <div class="qtyRow">
                <div class="qty">
                  Hours:
                  <input type="number" min="1" max="24" data-hours="${c.id}" value="${h}" />
                </div>
                <button class="del" data-remove="${c.id}" type="button">Remove</button>
              </div>
            </div>
            <div style="font-weight:950;color:rgba(244,244,251,.92)">$${line}</div>
          </div>
        `;
      }).join("") : `<div class="muted" style="padding:12px;">Add a tool to start a delivery.</div>`;

      return `
        <div class="cartBody">${items}</div>
        <div class="totals">
          <div class="totalLine"><span>Subtotal</span><strong>$${cartTotal().toFixed(2)}</strong></div>
          <div class="totalLine"><span>Est. saved vs retail</span><strong>$${Math.max(0, savedTotal()).toFixed(2)}</strong></div>
          <button class="checkout" id="checkout" ${state.cart.length ? "" : "disabled"}>Checkout (demo)</button>
        </div>
      `;
    }

    function viewOrders(){
      return `
        <div class="panel">
          <div class="panelHd">
            <div>
              <div class="panelTitle">Your orders</div>
              <div class="muted">Track deliveries + history</div>
            </div>
            <button class="pill" style="cursor:default;">Live</button>
          </div>
          <div class="orders">
            ${ORDERS.map(o => `
              <div class="order">
                <div class="orderTop">
                  <div>
                    <div class="orderId">${esc(o.id)} · ${esc(o.name)}</div>
                    <div class="orderMeta">${esc(o.status)} ${o.eta ? `· ETA ${esc(o.eta)}` : ""} · ${esc(o.time)}</div>
                  </div>
                  <div class="pill" style="cursor:default;">${esc(o.status)}</div>
                </div>
                <div class="bar"><div style="width:${Math.round(o.progress*100)}%"></div></div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function viewHelp(){
      return `
        <div class="panel">
          <div class="panelHd">
            <div>
              <div class="panelTitle">Help & Contact Us</div>
              <div class="muted">Support, safety, and delivery questions</div>
            </div>
            <button class="pill" id="fakeChat">Live chat (demo)</button>
          </div>

          <div class="helpWrap">
            <div class="helpGrid">
              <div class="card">
                <h3>FAQ</h3>
                <p><b>How does pricing work?</b> You pay hourly. The site shows an estimate vs retail.</p>
                <p><b>Where do you deliver?</b> Start with a small radius around a staging area. Expand later.</p>
                <p><b>Returns?</b> Pickup windows. You can schedule it after checkout (backend needed).</p>
              </div>

              <div class="card">
                <h3>Contact form</h3>
                <p>Send a message. In a static site this is “UI only” unless you wire it to a form service or a backend.</p>

                <div class="form">
                  <div class="field">
                    <div class="label">Name</div>
                    <input class="input" id="cName" placeholder="Your name" />
                  </div>
                  <div class="field">
                    <div class="label">Email</div>
                    <input class="input" id="cEmail" placeholder="you@email.com" />
                  </div>
                  <div class="field">
                    <div class="label">Message</div>
                    <textarea id="cMsg" placeholder="What do you need help with?"></textarea>
                  </div>
                  <button class="pill primary" id="sendMsg">Send message</button>
                  <div class="smallNote">Tip: easiest “real” contact on GitHub Pages is Formspree / Netlify Forms.</div>
                </div>
              </div>
            </div>

            <div class="sep"></div>

            <div class="card">
              <h3>Business / sponsors</h3>
              <p>Email: <span style="color:var(--text);font-weight:900;">support@dropkit.example</span> (placeholder)</p>
              <p>Hours: 9am–6pm</p>
            </div>
          </div>
        </div>
      `;
    }

    function viewAbout(){
      return `
        <div class="panel">
          <div class="panelHd">
            <div>
              <div class="panelTitle">About DropKit</div>
              <div class="muted">A tool rental service designed for speed</div>
            </div>
            <button class="pill" id="goHelpFromAbout">Contact</button>
          </div>

          <div class="helpWrap">
            <div class="card">
              <h3>What it is</h3>
              <p>DropKit is a tool delivery service for things you don’t need every day: heat guns, soldering irons, drills, etc.</p>
              <p>Start simple: small inventory, small delivery radius, predictable pricing.</p>
            </div>

            <div class="sep"></div>

            <div class="helpGrid">
              <div class="card">
                <h3>Safety</h3>
                <p>Tools require ID verification + waiver + basic safe-use checklist (backend feature).</p>
                <p>Drone delivery should follow local regulations and approved drop zones.</p>
              </div>
              <div class="card">
                <h3>Next steps</h3>
                <p>Once you need accounts, payments, and order tracking, that’s when Node.js makes sense.</p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function render(){
      if (state.route === "home") app.innerHTML = viewHome();
      if (state.route === "shop") app.innerHTML = viewShop();
      if (state.route === "orders") app.innerHTML = viewOrders();
      if (state.route === "help") app.innerHTML = viewHelp();
      if (state.route === "about") app.innerHTML = viewAbout();

      bindViewEvents();
    }

    // ─────────────────────────────────────────────
    // Drawer (mobile cart)
    // ─────────────────────────────────────────────
    const drawerWrap = document.getElementById("drawerWrap");
    const drawer = document.getElementById("drawer");
    document.getElementById("closeDrawer").addEventListener("click", closeDrawer);

    function openDrawerCart(){
      drawer.innerHTML = `
        <div class="panelHd">
          <div>
            <div class="panelTitle">Cart</div>
            <div class="muted">${state.cart.length ? `${state.cart.length} item${state.cart.length===1?"":"s"}` : "Empty"}</div>
          </div>
          <button class="pill" id="closeCartBtn">Close</button>
        </div>
        ${viewCartPanel()}
      `;
      drawerWrap.style.display = "block";
      document.getElementById("closeCartBtn").addEventListener("click", closeDrawer);
      bindCartEvents(drawer);
    }
    function closeDrawer(){
      drawerWrap.style.display = "none";
    }

    // ─────────────────────────────────────────────
    // Event wiring
    // ─────────────────────────────────────────────
    function bindCartEvents(scope){
      scope.querySelectorAll("[data-remove]").forEach(btn => {
        btn.addEventListener("click", () => removeFromCart(Number(btn.dataset.remove)));
      });
      scope.querySelectorAll("[data-hours]").forEach(inp => {
        inp.addEventListener("input", () => {
          const id = Number(inp.dataset.hours);
          let v = Number(inp.value || 1);
          if (!Number.isFinite(v)) v = 1;
          v = Math.max(1, Math.min(24, v));
          state.hours[id] = v;
          state.cart = state.cart.map(c => c.id === id ? { ...c, hours: v } : c);
          syncCartBadge();
          render();
        });
      });
      const checkoutBtn = scope.querySelector("#checkout");
      if (checkoutBtn){
        checkoutBtn.addEventListener("click", () => {
          if (!state.cart.length) return;
          toast("Checkout queued (demo)");
          state.cart = [];
          syncCartBadge();
          closeDrawer();
          render();
        });
      }
      const clearBtn = scope.querySelector("#clearCart");
      if (clearBtn){
        clearBtn.addEventListener("click", () => {
          state.cart = [];
          syncCartBadge();
          render();
        });
      }
    }

    function bindViewEvents(){
      // tool add
      app.querySelectorAll("[data-add]").forEach(card => {
        card.addEventListener("click", () => {
          const id = Number(card.dataset.add);
          const tool = TOOLS.find(t => t.id === id);
          if (tool) addToCart(tool);
        });
      });
      app.querySelectorAll("[data-add-btn]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const id = Number(btn.dataset.addBtn);
          const tool = TOOLS.find(t => t.id === id);
          if (tool) addToCart(tool);
        });
      });

      // categories
      app.querySelectorAll("[data-cat]").forEach(el => {
        el.addEventListener("click", () => {
          state.cat = el.dataset.cat;
          render();
        });
      });

      // cart events in main layout
      bindCartEvents(app);

      // home CTAs
      const ctaShop = document.getElementById("ctaShop");
      if (ctaShop) ctaShop.addEventListener("click", () => setRoute("shop"));
      const ctaHelp = document.getElementById("ctaHelp");
      if (ctaHelp) ctaHelp.addEventListener("click", () => setRoute("help"));
      const miniContact = document.getElementById("miniContact");
      if (miniContact) miniContact.addEventListener("click", () => setRoute("help"));

      // help buttons
      const fakeChat = document.getElementById("fakeChat");
      if (fakeChat) fakeChat.addEventListener("click", () => toast("Live chat is demo UI right now."));
      const sendMsg = document.getElementById("sendMsg");
      if (sendMsg) sendMsg.addEventListener("click", () => toast("Message sent (demo). Add backend/form service to make real."));

      // about -> contact
      const goHelpFromAbout = document.getElementById("goHelpFromAbout");
      if (goHelpFromAbout) goHelpFromAbout.addEventListener("click", () => setRoute("help"));
    }

    // header/nav events
    document.getElementById("goHome").addEventListener("click", () => setRoute("home"));
    document.getElementById("shopNow").addEventListener("click", () => setRoute("shop"));
    document.getElementById("helpBtn").addEventListener("click", () => setRoute("help"));

    document.getElementById("openCartMobile").addEventListener("click", () => openDrawerCart());

    document.querySelectorAll(".navLink").forEach(btn => {
      btn.addEventListener("click", () => setRoute(btn.dataset.route));
    });

    // footer route links
    document.querySelectorAll("[data-route]").forEach(el => {
      el.addEventListener("click", (e) => {
        e.preventDefault();
        setRoute(el.getAttribute("data-route"));
      });
    });

    // global search
    const search = document.getElementById("search");
    search.addEventListener("input", (e) => {
      state.search = e.target.value;
      // if they're searching, feel like amazon: jump them to shop
      if (state.route !== "shop") setRoute("shop");
      else render();
    });

    // init
    syncCartBadge();
    render();
</script>
</body>
</html>
